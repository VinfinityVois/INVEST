pack_id: secrets-core
title: Core secrets
version: 1
analyzer: secrets
patterns:
  - id: aws_access_key
    regex: '\bAKIA[0-9A-Z]{16}\b'
    severity: CRITICAL
    confidence: 0.99
    class: api-key
    description: AWS access key identifier
  - id: github_token
    regex: '\bgh[pousr]_[A-Za-z0-9]{20,}\b'
    severity: HIGH
    confidence: 0.99
    class: api-key
    description: GitHub access token
  - id: private_key
    regex: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
    severity: CRITICAL
    confidence: 0.99
    class: private-key
    description: Private key material
  - id: generic_assignment
    regex: '(?i)\b(?:api[_-]?key|access[_-]?token|client[_-]?secret|password|passwd)\b\s*[:=]\s*["'']([^"''\s]{8,})["'']'
    severity: MEDIUM
    confidence: 0.78
    class: secret
    description: Credential-like assignment
entropy:
  enabled: true
  min_length: 20
  threshold: 3.5
  severity: MEDIUM
  confidence: 0.76
