pack_id: secrets-spring
title: Spring configuration secrets
version: 1
analyzer: secrets
extends:
  - secrets-core
path_globs:
  - "**/application*.yml"
  - "**/application*.yaml"
  - "**/application*.properties"
  - "**/bootstrap*.yml"
  - "**/.env"
patterns:
  - id: spring_datasource_password
    regex: '(?i)spring\.datasource\.password\s*[:=]\s*["'']?([^\s"'']{8,})'
    severity: HIGH
    confidence: 0.90
    class: database-password
    description: Spring datasource password
  - id: spring_placeholder_default
    regex: '\$\{[^}:]+:([^}\s]{8,})\}'
    severity: HIGH
    confidence: 0.85
    class: configuration-secret
    description: Hard-coded default in Spring property placeholder
