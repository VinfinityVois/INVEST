services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-secworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secworkflow} -d ${POSTGRES_DB:-secworkflow}"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    working_dir: /app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      WORKSPACE_ROOT: /data/workspaces
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: [appdata:/data, workspaces:/data/workspaces]
  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    environment:
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/data/workspaces}
    depends_on:
      db: {condition: service_healthy}
    volumes: [appdata:/data]
  frontend:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes: [./frontend:/workspace]
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
  appdata:
  workspaces:
